name: CommitChecks

on:
  push:
    branches:
      - "**"

jobs:
  package-test:
    runs-on: xcode-27
    permissions:
      actions: read
      checks: write
      contents: read

    steps:
      - uses: maxim-lobanov/setup-xcode@v1.1
        with:
          xcode-version: "27.0"
      - uses: actions/checkout@v7
      - name: Run Test
        run: swift test --parallel --xunit-output TestResults.xml
      - name: Publish Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Swift Tests
          path: "TestResults*.xml"
          reporter: swift-xunit

  build-development:
    runs-on: xcode-27

    steps:
      - uses: maxim-lobanov/setup-xcode@v1.1
        with:
          xcode-version: "27.0"
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - name: Install Development dependencies
        run: mise exec -- tuist install
      - name: Generate Development project
        run: mise exec -- tuist generate --no-open
      - name: Build Development project
        run: |
          xcodebuild \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -project Development.xcodeproj \
            -scheme Development \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/StateGraphDerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify dynamic package products
        run: |
          APP_PATH="$RUNNER_TEMP/StateGraphDerivedData/Build/Products/Debug-iphonesimulator/Development.app"
          STATE_GRAPH_BINARY="$APP_PATH/Frameworks/StateGraph.framework/StateGraph"
          NORMALIZATION_BINARY="$APP_PATH/Frameworks/StateGraphNormalization.framework/StateGraphNormalization"

          otool -hv "$STATE_GRAPH_BINARY" | grep DYLIB
          otool -hv "$NORMALIZATION_BINARY" | grep DYLIB
          test "$(find "$APP_PATH" -type d -name 'StateGraph.framework' | wc -l | tr -d '[:space:]')" = "1"
          test "$(find "$APP_PATH" -type d -name 'StateGraphNormalization.framework' | wc -l | tr -d '[:space:]')" = "1"

  # StateGraph itself does not build on Linux yet, and resolving the package would
  # fetch swift-syntax, so this job compiles only Sources/StateGraph/Threading/ with
  # plain swiftc. That folder depends on nothing but the standard library and libc.
  linux-threading:
    runs-on: ubuntu-latest
    container: swift:6.3-noble

    steps:
      - uses: actions/checkout@v7
      - name: Type-check the threading component
        run: swiftc -swift-version 6 -warnings-as-errors -typecheck Sources/StateGraph/Threading/*.swift
      - name: Build the threading smoke test
        run: |
          swiftc -swift-version 6 -warnings-as-errors -O \
            Sources/StateGraph/Threading/*.swift CI/ThreadingSmoke/main.swift \
            -o "$RUNNER_TEMP/threading-smoke"
      - name: Run the threading smoke test
        run: |
          "$RUNNER_TEMP/threading-smoke"
